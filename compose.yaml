
services:
  php:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${APP_PORT:-8080}:80"
    environment:
      APP_ENV: prod
      APP_DEBUG: "0"
      APP_SECRET: ${APP_SECRET:-change-me-in-production}
      DEFAULT_URI: http://localhost:${APP_PORT:-8080}
      DATABASE_URL: sqlite:///%kernel.project_dir%/var/data_prod.db
      MESSENGER_TRANSPORT_DSN: sync://
      MAILER_DSN: null://null
      SERVER_NAME: :80
    tty: true
