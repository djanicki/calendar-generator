
services:
  php:
    build:
      context: .
      dockerfile: docker/frankenphp/Dockerfile
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      database:
        condition: service_healthy
    environment:
      APP_ENV: dev
      APP_DEBUG: "1"
      APP_SECRET: ${APP_SECRET:-change-me-in-production}
      DEFAULT_URI: http://localhost:${APP_PORT:-8000}
      DATABASE_URL: ${DATABASE_URL:-mysql://app:app@database:3306/app?serverVersion=8.4.0&charset=utf8mb4}
      MESSENGER_TRANSPORT_DSN: sync://
      MAILER_DSN: null://null
      SERVER_NAME: localhost
    volumes:
      - ./:/app
      - /app/var
    tty: true

  database:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-app}
      MYSQL_USER: ${MYSQL_USER:-app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-app}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - database_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  database_data:
